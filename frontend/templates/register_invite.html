{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskGPT - Complete Registration</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="container">
        <div class="auth-container">
            <div class="auth-header">
                <h1>📋 TaskGPT</h1>
                <p>Complete Your Registration</p>
            </div>
            
            <!-- Register Form via Invitation -->
            <div id="register-form" class="auth-form">
                <h2>Create Your Account</h2>
                <p style="margin-bottom: 20px; color: #666;">
                    You've been invited to join TaskGPT. Complete your registration below.
                </p>
                <form id="registerForm">
                    <input type="hidden" id="invitation-token" value="{{ token }}">
                    <div class="form-group">
                        <label for="register-email">Email</label>
                        <input type="email" id="register-email" value="{{ email }}" readonly>
                    </div>
                    <div class="form-group">
                        <label for="register-username">Username</label>
                        <input type="text" id="register-username" required>
                    </div>
                    <div class="form-group">
                        <label for="register-password">Password</label>
                        <input type="password" id="register-password" required minlength="8">
                    </div>
                    <div class="form-group">
                        <label for="register-password-confirm">Confirm Password</label>
                        <input type="password" id="register-password-confirm" required minlength="8">
                    </div>
                    <button type="submit" class="btn btn-primary">Complete Registration</button>
                </form>
            </div>
            
            <div id="message" class="message"></div>
        </div>
    </div>
    
    <script src="{% static 'js/invite-register.js' %}"></script>
</body>
</html>
